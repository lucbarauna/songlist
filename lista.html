<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>

<meta name="theme-color" content="#1a1a2e">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>JD Maps</title>

<style>
:root{--color-primary:#667eea;--color-secondary:#764ba2;--color-surface:#f8f9ff;--color-card:#fff;--color-text:#1a1a2e;--color-muted:#666;--color-border:#e0e0e0;--tag-text:#24458f;--shadow:0 4px 10px rgba(102,126,234,.1);--shadow-hover:0 8px 20px rgba(102,126,234,.2);--transition:background-color .2s,color .2s,border-color .2s,transform .2s;--music-color:#667eea}
[data-theme="dark"]{--color-surface:#0f0f1e;--color-card:#1a1a2e;--color-text:#e0e0e0;--color-muted:#a0a0a0;--color-border:#2d2d3d;--tag-text:#91adff;--shadow:0 4px 10px #0006;--shadow-hover:0 8px 20px rgba(102,126,234,.2)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--color-surface);color:var(--color-text);min-height:100vh;overflow-x:hidden}
.hidden{display:none!important}
.container{max-width:1600px;margin:0 auto;padding:20px;width:100%}
#loadingSection{display:flex;flex-direction:column;align-items:center;justify-content:center;height:70vh;color:var(--color-primary);font-size:20px;font-weight:bold}
.spinner{border:4px solid rgba(102,126,234,.3);border-top:4px solid var(--color-primary);border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.header{background:linear-gradient(135deg,var(--color-primary),var(--color-secondary));color:#fff;padding:40px 20px;border-radius:16px;margin-bottom:30px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.header-content{position:relative;z-index:2;text-align:center}
.header h1{font-size:clamp(24px,5vw,42px);font-weight:800;margin-bottom:10px;letter-spacing:-1px}
.header-subtitle{font-size:clamp(16px,2.5vw,20px);opacity:.9}
.theme-toggle{position:absolute;top:20px;right:20px;z-index:10;background:var(--color-card);border:2px solid var(--color-border);color:var(--color-text);min-width:44px;height:44px;padding:0 10px;border-radius:12px;cursor:pointer;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:var(--transition);box-shadow:var(--shadow)}
.theme-toggle:hover,.btn-reset:hover{background:var(--color-primary);color:#fff;border-color:var(--color-primary);transform:translateY(-2px)}
.tabs{display:flex;gap:10px;margin-bottom:20px;border-bottom:2px solid var(--color-border);padding-bottom:10px;flex-wrap:wrap}
.tab-btn{background:none;border:none;font-size:18px;font-weight:bold;color:var(--color-muted);cursor:pointer;padding:10px 20px;transition:var(--transition);border-radius:8px}
.tab-btn:hover{background:rgba(102,126,234,.1);color:var(--color-primary)}
.tab-btn.active,.tab-btn[aria-selected="true"]{background:var(--color-primary);color:#fff}
.dashboard-controls,.recommendation-controls{background:var(--color-card);padding:20px 25px;border-radius:12px;border:1px solid var(--color-border);margin-bottom:20px;box-shadow:var(--shadow);transition:opacity .3s}
.dashboard-controls{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}
.recommendation-heading{margin-bottom:16px}

.recommendation-grid{display:grid;grid-template-columns:minmax(220px,2fr) repeat(5,minmax(120px,1fr));gap:12px}
.rule-control{display:flex;flex-direction:column;gap:7px;color:var(--color-muted);font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.rule-control select,.rule-control input{min-height:42px;padding:9px 10px;border:1px solid var(--color-border);border-radius:8px;background:var(--color-surface);color:var(--color-text);font:inherit;text-transform:none}

.slider-group{display:flex;flex-direction:column;gap:8px}
.slider-header{display:flex;justify-content:space-between;font-size:13px;font-weight:bold;text-transform:uppercase}
.sp-label{color:#1db954}
.yt-label{color:red}
.weight-badge{background:rgba(29,185,84,.2);padding:2px 8px;border-radius:4px;color:var(--color-text)}
.yt-badge{background:rgba(255,0,0,.2)}
input[type=range]{-webkit-appearance:none;width:100%;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:18px;width:18px;border-radius:50%;background:var(--color-primary);cursor:pointer;margin-top:-6px;box-shadow:0 0 10px rgba(102,126,234,.5)}

.filters-section{background:var(--color-card);padding:25px;border-radius:16px;margin-bottom:20px;box-shadow:var(--shadow);z-index:99;border:1px solid var(--color-border)}
.filters-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;min-width:0}
.search-full{grid-column:1/-1}
.filter-group{display:flex;flex-direction:column;min-width:0}
.filter-group label{font-weight:600;margin-bottom:8px;font-size:13px;color:var(--color-muted);text-transform:uppercase;letter-spacing:.5px}
.filter-group input,.filter-group select{padding:12px;background:var(--color-surface);color:var(--color-text);border:2px solid var(--color-border);border-radius:10px;font-size:14px;transition:var(--transition);font-family:inherit;width:100%;min-width:0;max-width:100%}
.filter-group input:focus,.filter-group select:focus{outline:none;border-color:var(--color-primary);background:var(--color-card);box-shadow:0 0 0 4px rgba(102,126,234,.1)}
.btn-reset{padding:10px 20px;background:var(--color-surface);color:var(--color-text);border:2px solid var(--color-border);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:var(--transition)}
.results-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.results-info{font-size:13px;color:var(--color-muted);font-weight:500;margin:0}

.music-card{background:var(--color-card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;height:100%;border:1px solid var(--color-border);position:relative;transform:translateZ(0)}
.music-cover-wrapper{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#111}
.music-cover{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;background:rgba(0,0,0,.85);color:#fff;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.3);max-width:70%;overflow:hidden;text-overflow:ellipsis;z-index:2}

.music-artist{font-size:12px;color:var(--color-muted);margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:1;line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

.music-tag{background:var(--color-surface);color:var(--tag-text);padding:4px 8px;border-radius:6px;font-size:10px;font-weight:600;border:1px solid var(--color-border)}
.btn-preview{width:100%;padding:10px;background:linear-gradient(135deg,var(--color-primary),var(--color-secondary));color:#fff;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;margin-top:auto;text-transform:uppercase;letter-spacing:.5px;transition:var(--transition)}
.btn-preview:hover{opacity:.9}
.modal{display:none;position:fixed;inset:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:1000;align-items:center;justify-content:center;padding:20px;border:none;margin:0;max-width:none;max-height:none}
.modal.active{display:flex}
.modal-content{background:var(--color-card);border-radius:16px;max-width:800px;width:100%;position:relative;color:var(--color-text);overflow:hidden;display:flex;flex-direction:column;max-height:90vh;flex-shrink:0;will-change:box-shadow}
.modal-header{padding:20px;border-bottom:1px solid var(--color-border);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-header-info{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.modal-title{font-size:20px;font-weight:700;line-height:1.2}
.modal-artist{font-size:14px;color:var(--color-muted);font-weight:600}
.modal-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;width:100%}
.modal-close{background:var(--color-primary);color:#fff;border:none;width:40px;height:40px;border-radius:10px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition);flex-shrink:0}
.modal-close:hover{transform:scale(1.1)}
.modal-body{padding:20px;overflow-y:auto;flex:1;min-height:0}
.video-container{position:relative;width:100%;max-width:calc(55vh * 16 / 9);max-height:55vh;aspect-ratio:16/9;margin:0 auto;background:#000;border-radius:12px;overflow:hidden}
#modalVideoPlayer{width:100%;height:100%;display:block;object-fit:contain}
#modalAudioPlayer{display:none}
.buffer-loading{position:absolute;inset:0;z-index:2;align-items:center;justify-content:center;background:rgba(0,0,0,.72);font-size:14px;font-weight:600;color:var(--color-primary);display:none;padding:20px;text-align:center}
.empty-state{grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--color-muted)}
.empty-state button{margin-top:16px;padding:10px 20px;background:var(--color-primary);color:#fff;border:none;border-radius:10px;font-weight:600;cursor:pointer;transition:var(--transition)}
.empty-state button:hover{transform:translateY(-2px)}
@media (max-width:768px){
.container{padding:12px}.header{padding:30px 15px}.header h1{font-size:28px}.theme-toggle{top:15px;right:15px;min-width:38px;height:38px;padding:0 8px;font-size:11px}
.music-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:15px}
.filters-section{padding:15px}
.filters-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.search-full{grid-column:1/-1}
.tabs{gap:6px}.tab-btn{font-size:14px;padding:8px 12px;flex:1;text-align:center}
.dashboard-controls,.recommendation-controls{grid-template-columns:1fr;gap:12px;padding:15px}
.recommendation-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.recommendation-grid .rule-control:first-child{grid-column:1/-1}
.modal{padding:12px}.modal-header,.modal-body{padding:16px}.modal-title{font-size:18px}
}
.music-cover.cover-error{opacity:.35;filter:grayscale(1)}
.tab-btn:focus-visible,.btn-preview:focus-visible,.theme-toggle:focus-visible,.btn-reset:focus-visible,.modal-close:focus-visible,input:focus-visible,select:focus-visible,.checkbox-list label:focus-within{outline:3px solid var(--color-primary);outline-offset:2px}
.percent-total{color:var(--color-muted);font-size:12px;margin-top:6px}
.checkbox-list{display:flex;flex-wrap:wrap;gap:6px;max-height:100px;overflow-y:auto;padding:8px;border:1px solid var(--color-border);border-radius:8px;background:var(--color-surface)}
.checkbox-list label{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;text-transform:none;background:var(--color-card);padding:4px 8px;border-radius:6px;border:1px solid var(--color-border);cursor:pointer}
.checkbox-list input[type=checkbox]{width:auto;min-height:auto;accent-color:var(--color-primary)}
</style>

</head>
<body>

<section class="filters-section" id="filtersSection">

</main>
</div>
<div class="modal" id="videoModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalArtist">

</div>
</div>
</div>

function shuffleArray(arr) {
  let c = [...arr];
  for (let j = c.length - 1; j > 0; j--) {
    let r = Math.floor(Math.random() * (j + 1));
    [c[j], c[r]] = [c[r], c[j]];
  }
  return c;
}

let basePoolLg = sortedDb.filter(x=>x.originalGame===lG);

let basePoolNo = sortedDb;

let quotaMeta = {
  Next: new Map(basePoolNx.map((x,i)=>[x.uuid, {rank: i+1, total: basePoolNx.length}])),
  Lastgame: new Map(basePoolLg.map((x,i)=>[x.uuid, {rank: i+1, total: basePoolLg.length}])),
  Descoberta: new Map(basePoolDs.map((x,i)=>[x.uuid, {rank: i+1, total: basePoolDs.length}])),
  Normal: new Map(basePoolNo.map((x,i)=>[x.uuid, {rank: i+1, total: basePoolNo.length}]))
};

let queueLastgame = shuffleArray(basePoolLg.slice(0, 20)).concat(basePoolLg.slice(20));

let queueNext = [];
let chunkNextSize = Math.max(1, Math.ceil(basePoolNx.length / 5));
for (let i = 0; i < 5; i++) {
  let slice = basePoolNx.slice(i * chunkNextSize, (i + 1) * chunkNextSize);
  queueNext.push(...shuffleArray(slice));
}

let queueDescoberta = shuffleArray(basePoolDs);

let rawNormalRemaining = [...basePoolNo];
let bufferNormal = [];

let vNx=Number($('ruleJdnextPercent').value)||0,vLg=Number($('ruleLastgamePercent').value)||0,vDs=Number($('ruleDiscoverPercent').value)||0,vNo=Number($('ruleNormalPercent').value)||0;
let tot=vNx+vLg+vDs+vNo; if(tot===0){vNo=100;tot=100}
let qts=[{k:'Next',c:(vNx/tot)*20},{k:'Lastgame',c:(vLg/tot)*20},{k:'Descoberta',c:(vDs/tot)*20},{k:'Normal',c:(vNo/tot)*20}];
let sl=qts.map(x=>Math.floor(x.c));
let rm=20-sl.reduce((a,b)=>a+b,0);
qts.forEach((x,i)=>{x.f=x.c-sl[i];x.i=i;x.cnt=sl[i]});
qts.sort((a,b)=>b.f-a.f).forEach(x=>{if(rm-->0)qts[x.i].cnt++});
let pt=[]; let pq=qts.map(x=>({k:x.k,cnt:x.cnt,a:0}));

pq.forEach(x=>{x.a+=x.cnt;if(x.a>mx){mx=x.a;ch=x}});
pt.push(ch.k); ch.a-=20;
}

let queues = {
  Next: queueNext,
  Lastgame: queueLastgame,
  Descoberta: queueDescoberta
};

function getNextNormal() {
  while (bufferNormal.length === 0 && rawNormalRemaining.length > 0) {
    let next100 = rawNormalRemaining.splice(0, 100);
    bufferNormal.push(...shuffleArray(next100));
  }
  while (bufferNormal.length > 0) {
    let candidate = bufferNormal.shift();
    if (!u.has(candidate.uuid)) {
      return candidate;
    }
  }
  return null;
}

function getFromQueue(type) {
  let q = queues[type];
  while (q && q.length > 0) {
    let candidate = q.shift();
    if (!u.has(candidate.uuid)) {
      return candidate;
    }
  }
  return null;
}

while (masterShuffle.length < db.length) {

        tag = 'Normal';
        sng = getNextNormal();
      }
    }
    
    if (!sng) {
      let unassigned = sortedDb.find(x => !u.has(x.uuid));
      if (unassigned) {
        sng = unassigned;
        tag = 'Normal';
      }
    }

      u.add(sng.uuid);
      let meta = quotaMeta[tag].get(sng.uuid) || { rank: sng.finalRank, total: db.length };
      let quotaText = `${tag} (${meta.rank}/${meta.total})`;
      batch20.push({ ...sng, quotaTag: tag, quotaText: quotaText });
    }
  }

}
}
