<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<script>
(function(){
    const setTheme = () => document.documentElement.setAttribute('data-theme', matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    setTheme();
    matchMedia('(prefers-color-scheme: light)').addEventListener('change', setTheme);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup do Catálogo</title>
<style>
:root{--color-primary:#667eea;--color-surface:#0f0f1e;--color-card:#1a1a2e;--color-text:#e0e0e0;--color-border:#2d2d3d;}
[data-theme="light"]{--color-surface:#f8f9ff;--color-card:#fff;--color-text:#1a1a2e;--color-border:#e0e0e0;}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--color-surface);color:var(--color-text);padding:20px;max-width:800px;margin:0 auto;}
.card{background:var(--color-card);padding:20px;border-radius:12px;border:1px solid var(--color-border);margin-bottom:20px;}
h1, h2, h3{margin-bottom:15px; color:var(--color-text);}
h3{font-size:15px;color:var(--color-primary);margin-top:10px;}
label{display:block;margin-bottom:10px;font-size:14px;font-weight:600;}
input, select{width:100%;padding:10px;margin-top:5px;background:var(--color-surface);color:var(--color-text);border:1px solid var(--color-border);border-radius:8px;}
.checkbox-list{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:15px;}
.checkbox-list label{display:flex;align-items:center;gap:6px;width:auto;cursor:pointer;background:var(--color-surface);padding:8px 12px;border-radius:8px;border:1px solid var(--color-border);}
.checkbox-list input[type=checkbox]{width:auto;margin:0;accent-color:var(--color-primary);}
button{width:100%;padding:15px;background:var(--color-primary);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;transition:0.2s;}
button:hover{opacity:0.9;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
.grid-4{display:grid;grid-template-columns:repeat(4, 1fr);gap:15px;}

details.advanced-card{background:var(--color-card);border-radius:12px;border:1px solid var(--color-border);margin-bottom:20px;padding:15px 20px;}
details.advanced-card summary{font-size:16px;font-weight:700;cursor:pointer;user-select:none;color:var(--color-primary);outline:none;padding:5px 0;}
details.advanced-card[open] summary{margin-bottom:15px;border-bottom:1px solid var(--color-border);padding-bottom:10px;}
.advanced-content{display:flex;flex-direction:column;gap:15px;}

@media(max-width:600px){.grid-2,.grid-4{grid-template-columns:1fr;}}
</style>
</head>
<body>
<h1>Configuração do Catálogo</h1>
<form id="setupForm">
    <div class="card">
        <h2>Idioma</h2>
        <select id="lang">
            <option value="pt-br">Português (Brasil)</option>
            <option value="en">English</option>
        </select>
    </div>

    <div class="card">
        <h2>Seus Produtos</h2>
        <div id="productsContainer">
            <p>Carregando produtos...</p>
        </div>
    </div>

    <details class="advanced-card">
        <summary>⚙ Configurações Avançadas</summary>
        <div class="advanced-content">
            <div>
                <h3>Pesos dos Rankings</h3>
                <div class="grid-2">
                    <label>Peso Spotify <input type="number" id="wSp" min="0" max="10" step="0.5" value="1"></label>
                    <label>Peso YouTube <input type="number" id="wYt" min="0" max="10" step="0.5" value="2"></label>
                </div>
            </div>

            <div>
                <h3>Regras de Recomendação (%)</h3>
                <div class="grid-4">
                    <label>JD Next <input type="number" id="rNx" value="10"></label>
                    <label>Último Jogo <input type="number" id="rLg" value="10"></label>
                    <label>Descoberta <input type="number" id="rDs" value="5"></label>
                    <label>Normal <input type="number" id="rNo" value="75"></label>
                </div>
            </div>
        </div>
    </details>

    <button type="submit">Acessar Catálogo</button>
</form>

<script>
async function fetchGzip(url) {
    let res = await fetch(url);
    if (!res.ok) throw new Error('Falha ao baixar ' + url);
    let ds = new DecompressionStream('gzip');
    let stream = res.body.pipeThrough(ds);
    let text = await new Response(stream).text();
    return JSON.parse(text);
}

async function loadProducts() {
    let langChoice = document.getElementById('lang').value;
    try {
        let lang = await fetchGzip(`./languages/${langChoice}.gz`);
        let y = lang.p?.y || {};
        let s = lang.p?.s || {};
        
        let html = '<h3>Assinatura / Edições Anuais (y)</h3><div class="checkbox-list">';
        for (let k in y) {
            html += `<label><input type="checkbox" name="prod" value="${k}"> ${y[k]}</label>`;
        }
        html += '</div><h3>Pacotes de Música (s)</h3><div class="checkbox-list">';
        for (let k in s) {
            html += `<label><input type="checkbox" name="prod" value="${k}"> ${s[k]}</label>`;
        }
        html += '</div>';
        document.getElementById('productsContainer').innerHTML = html;
    } catch (e) {
        document.getElementById('productsContainer').innerHTML = `<p style="color:#ff6b6b">Erro ao carregar lista de produtos de ./languages/${langChoice}.gz</p>`;
        console.error(e);
    }
}

document.getElementById('lang').addEventListener('change', loadProducts);
loadProducts();

document.getElementById('setupForm').addEventListener('submit', function(e) {
    e.preventDefault();
    let lang = document.getElementById('lang').value;
    let wSp = document.getElementById('wSp').value;
    let wYt = document.getElementById('wYt').value;
    let rNx = document.getElementById('rNx').value;
    let rLg = document.getElementById('rLg').value;
    let rDs = document.getElementById('rDs').value;
    let rNo = document.getElementById('rNo').value;
    
    let prods = Array.from(document.querySelectorAll('input[name="prod"]:checked')).map(cb => cb.value);
    
    let params = new URLSearchParams();
    params.set('lang', lang);
    params.set('wSp', wSp);
    params.set('wYt', wYt);
    params.set('rNx', rNx);
    params.set('rLg', rLg);
    params.set('rDs', rDs);
    params.set('rNo', rNo);
    if (prods.length > 0) {
        params.set('prod', prods.join(','));
    }
    
    window.location.href = 'index.html?' + params.toString();
});
</script>
</body>
</html>
